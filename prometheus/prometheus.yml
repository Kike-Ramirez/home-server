global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.0.100:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'blackbox-icmp'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 192.168.0.1   # gateway
          - 1.1.1.1       # internet reachability
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'homeassistant'
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/ha-token.txt
    static_configs:
      - targets: ['192.168.0.100:8123']

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://vaultwarden:80/alive']
        labels: {service: vaultwarden}
      - targets: ['http://nginx-proxy-manager:81/']
        labels: {service: nginx-proxy-manager}
      - targets: ['http://192.168.0.100:8123/']
        labels: {service: homeassistant}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
